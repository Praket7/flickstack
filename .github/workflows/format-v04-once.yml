name: Format v0.4 Rust Once

on:
  push:
    branches: ['feature/flicksmith-v0.4-professional-motion-engine']
    paths: ['.github/workflows/format-v04-once.yml']

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/flicksmith-v0.4-professional-motion-engine
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Run rustfmt and capture diagnostics
        id: fmt
        shell: bash
        run: |
          set +e
          cargo fmt > rustfmt-output.txt 2>&1
          FMT_EXIT=$?
          git status --short > rustfmt-status.txt
          git diff --binary > rustfmt.patch
          echo "exit=$FMT_EXIT" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload rustfmt diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-diagnostics
          path: |
            rustfmt-output.txt
            rustfmt-status.txt
            rustfmt.patch
      - name: Commit formatted Rust source
        if: steps.fmt.outputs.exit == '0'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'Praket7'
          git config user.email '149203433+Praket7@users.noreply.github.com'
          git add -u
          git commit -m 'style: rustfmt v0.4 native source'
          git push origin HEAD:feature/flicksmith-v0.4-professional-motion-engine
      - name: Fail on rustfmt parser error
        if: steps.fmt.outputs.exit != '0'
        run: exit 1
