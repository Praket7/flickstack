name: Render Codex Promo

on:
  push:
    branches:
      - promo/codex-usage-v1
    paths:
      - 'examples/codex-promo/**'
      - '.github/workflows/render-codex-promo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-codex-promo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Ensure FFmpeg
        run: command -v ffmpeg >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Generate Codex UI scenes and soundtrack
        run: node --experimental-strip-types examples/codex-promo/render-assets.ts
      - name: Master original soundtrack
        run: |
          ffmpeg -y -i examples/codex-promo/work/soundtrack.wav \
            -af "loudnorm=I=-14:TP=-1.5:LRA=7" \
            examples/codex-promo/work/soundtrack-mastered.wav
          mv examples/codex-promo/work/soundtrack-mastered.wav examples/codex-promo/work/soundtrack.wav
      - name: Validate canonical FlickSmith project
        run: node --experimental-strip-types apps/cli/src/index.ts validate --project examples/codex-promo/project.flick.json
      - name: Render with FlickSmith
        run: node --experimental-strip-types apps/cli/src/index.ts render --project examples/codex-promo/project.flick.json --out examples/codex-promo/out/Codex_Usage_Promo_42s.mp4
      - name: Run FlickSmith QC
        run: node --experimental-strip-types apps/cli/src/index.ts qc examples/codex-promo/out/Codex_Usage_Promo_42s.mp4 --project examples/codex-promo/project.flick.json > examples/codex-promo/out/QC.json
      - name: Inspect deliverable
        run: ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate -of json examples/codex-promo/out/Codex_Usage_Promo_42s.mp4 > examples/codex-promo/out/ffprobe.json
      - name: Analyze delivery loudness
        run: ffmpeg -hide_banner -nostats -i examples/codex-promo/out/Codex_Usage_Promo_42s.mp4 -af "loudnorm=I=-14:TP=-1.5:LRA=7:print_format=json" -f null - 2> examples/codex-promo/out/loudness.txt
      - name: Build visual contact sheet
        run: ffmpeg -y -i examples/codex-promo/out/Codex_Usage_Promo_42s.mp4 -vf "fps=1/5,scale=480:-1,tile=3x3:padding=8:margin=8" -frames:v 1 examples/codex-promo/out/contact-sheet.jpg
      - name: Upload promo artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-usage-promo-42s
          path: |
            examples/codex-promo/out/Codex_Usage_Promo_42s.mp4
            examples/codex-promo/out/contact-sheet.jpg
            examples/codex-promo/out/QC.json
            examples/codex-promo/out/ffprobe.json
            examples/codex-promo/out/loudness.txt
            examples/codex-promo/out/render-manifest.json
            examples/codex-promo/project.flick.json
            examples/codex-promo/render-assets.ts
          retention-days: 14
