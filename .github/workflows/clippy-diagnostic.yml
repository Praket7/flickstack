name: Temporary clippy diagnostics
on:
  push:
    branches: ['feature/flicksmith-v0.5-final']
permissions:
  contents: write
jobs:
  clippy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/flicksmith-v0.5-final
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - name: Capture clippy diagnostics
        run: |
          set +e
          cargo clippy --workspace --all-targets -- -D warnings > clippy-diagnostic.txt 2>&1
          STATUS=$?
          echo "exit_status=$STATUS" >> clippy-diagnostic.txt
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clippy-diagnostic.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(ci): capture clippy diagnostics'
          git push origin HEAD:feature/flicksmith-v0.5-final
