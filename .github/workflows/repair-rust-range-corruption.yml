name: Temporary Rust range repair
on:
  push:
    branches: ['feature/flicksmith-v0.5-final']
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/flicksmith-v0.5-final
      - name: Repair corrupted range and slice syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(r'(?<![\d.])(\d+)\.0\.(\d+)')
          changed = []
          for path in Path('crates').rglob('*.rs'):
              text = path.read_text()
              fixed, count = pattern.subn(r'\1..\2', text)
              if count:
                  path.write_text(fixed)
                  changed.append((str(path), count))
          for path, count in changed:
              print(f'{path}: repaired {count}')
          if not changed:
              print('No corrupted range syntax found')
          PY
      - name: Commit repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(rust): restore corrupted range and slice syntax'
          git push origin HEAD:feature/flicksmith-v0.5-final
