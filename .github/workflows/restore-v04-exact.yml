name: Restore exact FlickSmith v0.4 source

on:
  push:
    branches: ['bootstrap-v04-final-upload-0909']
    paths: ['restore-v04-exact/READY']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch and verify exact v0.4 source snapshot
        shell: bash
        env:
          SNAPSHOT_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-28f0-81f5-9aa4-abaaea594a4f/raw?se=2026-10-09T11%3A24%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=4a3e441b-1a27-56aa-9898-d9678fe03a4f&skoid=a1be202a-6464-476c-a496-723317c4a4db&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-09T01%3A18%3A10Z&ske=2026-10-10T01%3A18%3A10Z&sks=b&skv=2026-02-06&sig=eGkPTjK0A7WZ/%2Bb4bSAAJ2O8IUPkYOzO5qH5z1BnKYk%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$SNAPSHOT_URL" -o /tmp/flicksmith-v04-src.tar.xz
          test "$(sha256sum /tmp/flicksmith-v04-src.tar.xz | awk '{print $1}')" = "e20d844cb4083eda67035f2b0b4385154a75e58aeeb49ea822c7a95c11b3c219"
          rm -rf /tmp/flicksmith-v04 && mkdir -p /tmp/flicksmith-v04
          tar -xJf /tmp/flicksmith-v04-src.tar.xz -C /tmp/flicksmith-v04
          cd /tmp/flicksmith-v04
          git init
          git config user.name "Praket7"
          git config user.email "149203433+Praket7@users.noreply.github.com"
          git add -A
          test "$(git write-tree)" = "90dc5dae850fcdac0c73906d0354ef596a2cccf4"
          git commit -m "feat: FlickSmith v0.4 professional motion engine"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/feature/flicksmith-v0.4-professional-motion-engine
        env:
          GITHUB_TOKEN: ${{ github.token }}
