name: Restore exact FlickSmith v0.4 source

on:
  push:
    branches: ['bootstrap-v04-final-upload-0909']
    paths: ['restore-v04-exact/READY']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify exact source and publish non-workflow tree
        shell: bash
        env:
          SNAPSHOT_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-5984-81f5-8936-36f775396507/raw?se=2026-10-09T11%3A30%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=a068b744-c565-5a82-a5aa-664f88bbe099&skoid=a1be202a-6464-476c-a496-723317c4a4db&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-09T01%3A22%3A43Z&ske=2026-10-10T01%3A22%3A43Z&sks=b&skv=2026-02-06&sig=qHHB5HF6qzuG/261BtkNj202PCan9VI4iqq8zrHhkio%3D'
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --retry-delay 1 "$SNAPSHOT_URL" -o /tmp/flicksmith-v04-src.tar.xz
          test "$(wc -c < /tmp/flicksmith-v04-src.tar.xz | tr -d ' ')" = "290316"
          test "$(sha256sum /tmp/flicksmith-v04-src.tar.xz | awk '{print $1}')" = "e20d844cb4083eda67035f2b0b4385154a75e58aeeb49ea822c7a95c11b3c219"

          rm -rf /tmp/flicksmith-v04 && mkdir -p /tmp/flicksmith-v04
          tar -xJf /tmp/flicksmith-v04-src.tar.xz -C /tmp/flicksmith-v04
          cd /tmp/flicksmith-v04
          git init -q
          git config user.name "Praket7"
          git config user.email "149203433+Praket7@users.noreply.github.com"
          git add -A
          test "$(git write-tree)" = "90dc5dae850fcdac0c73906d0354ef596a2cccf4"

          # GitHub Actions tokens may not create/update workflow files. Remove only
          # those three verified files for this push; the connected GitHub API adds
          # them back verbatim immediately afterward and we re-check the final tree.
          git rm -q .github/workflows/ci.yml .github/workflows/desktop-build.yml .github/workflows/native-v04.yml
          git commit -q -m "feat: FlickSmith v0.4 professional motion engine"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/feature/flicksmith-v0.4-professional-motion-engine
