name: One-shot WGPU rustfmt repair
on:
  push:
    branches: ['feature/flicksmith-v0.5-final']
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/flicksmith-v0.5-final
      - name: Apply rustfmt layout
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/flick-render-wgpu/src/lib.rs')
          text = path.read_text()
          old = '''        let padded = row.div_ceil(wgpu::COPY_BYTES_PER_ROW_ALIGNMENT)\n            * wgpu::COPY_BYTES_PER_ROW_ALIGNMENT;'''
          new = '''        let padded =\n            row.div_ceil(wgpu::COPY_BYTES_PER_ROW_ALIGNMENT) * wgpu::COPY_BYTES_PER_ROW_ALIGNMENT;'''
          if old not in text:
              raise SystemExit('expected pre-rustfmt expression not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/flick-render-wgpu/src/lib.rs
          git commit -m 'style(wgpu): apply rustfmt to readback alignment'
          git push origin HEAD:feature/flicksmith-v0.5-final
