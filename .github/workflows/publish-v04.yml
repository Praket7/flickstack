name: Publish exact FlickSmith v0.4 source

on:
  push:
    branches: [bootstrap-v04-publish-release-final5]
    paths:
      - 'restore-v04/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify v0.4 source
        shell: bash
        run: |
          set -euo pipefail
          cat restore-v04/part-* > /tmp/flicksmith-v04.b64
          base64 --decode /tmp/flicksmith-v04.b64 > /tmp/flicksmith-v04.tar.xz
          test "$(sha256sum /tmp/flicksmith-v04.tar.xz | awk '{print $1}')" = "e20d844cb4083eda67035f2b0b4385154a75e58aeeb49ea822c7a95c11b3c219"
          rm -rf /tmp/flicksmith-v04-src
          mkdir -p /tmp/flicksmith-v04-src
          tar -xJf /tmp/flicksmith-v04.tar.xz -C /tmp/flicksmith-v04-src
          cd /tmp/flicksmith-v04-src
          git init
          git config user.name "Praket7"
          git config user.email "149203433+Praket7@users.noreply.github.com"
          git add -A
          test "$(git write-tree)" = "90dc5dae850fcdac0c73906d0354ef596a2cccf4"
          git commit -m "feat: FlickSmith v0.4 professional motion engine"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/feature/flicksmith-v0.4-professional-motion-engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
