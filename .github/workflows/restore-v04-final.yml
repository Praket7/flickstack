name: Restore FlickSmith v0.4 exact source

on:
  push:
    branches: [bootstrap-flicksmith-restore]
    paths: ['restore-v04-final/READY']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-v04:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap-flicksmith-restore
          fetch-depth: 0
      - name: Fetch and verify exact v0.4 source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1XRs_MkpzDQRL96RKZbV2bI2OoPV70CmG&export=download&confirm=t' \
            -o /tmp/flicksmith-v04-src.tar.xz
          echo "downloaded $(stat -c%s /tmp/flicksmith-v04-src.tar.xz) bytes"
          sha256sum /tmp/flicksmith-v04-src.tar.xz
          test "$(sha256sum /tmp/flicksmith-v04-src.tar.xz | awk '{print $1}')" = "e20d844cb4083eda67035f2b0b4385154a75e58aeeb49ea822c7a95c11b3c219"
      - name: Reconstruct and publish exact v0.4 tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v04-src
          mkdir /tmp/v04-src
          tar -xJf /tmp/flicksmith-v04-src.tar.xz -C /tmp/v04-src
          git config user.name "Praket7"
          git config user.email "149203433+Praket7@users.noreply.github.com"
          git checkout --orphan flicksmith-v04-exact
          git rm -rf .
          cp -a /tmp/v04-src/. .
          git add -A
          echo "tree $(git write-tree)"
          test "$(git write-tree)" = "90dc5dae850fcdac0c73906d0354ef596a2cccf4"
          git commit -m "feat: FlickSmith v0.4 professional motion engine"
          V04_SHA="$(git rev-parse HEAD)"
          git push --force origin "$V04_SHA:refs/heads/feature/flicksmith-v0.4-professional-motion-engine"
