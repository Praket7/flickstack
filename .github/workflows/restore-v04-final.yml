name: Restore FlickSmith v0.4 Exact Source

on:
  push:
    branches: [bootstrap-v04-final8]
    paths:
      - 'restore-v04-final/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-v04:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify exact v0.4 source
        shell: bash
        run: |
          set -euo pipefail
          cat restore-v04-final/part-* > /tmp/flicksmith-v04.b64
          base64 --decode /tmp/flicksmith-v04.b64 > /tmp/flicksmith-v04.tar.xz
          test "$(sha256sum /tmp/flicksmith-v04.tar.xz | awk '{print $1}')" = "e20d844cb4083eda67035f2b0b4385154a75e58aeeb49ea822c7a95c11b3c219"
          mkdir -p /tmp/flicksmith-v04-src
          tar -xJf /tmp/flicksmith-v04.tar.xz -C /tmp/flicksmith-v04-src
          cd /tmp/flicksmith-v04-src
          git init -q
          git config user.name "Praket7"
          git config user.email "149203433+Praket7@users.noreply.github.com"
          git add -A
          test "$(git write-tree)" = "90dc5dae850fcdac0c73906d0354ef596a2cccf4"
          git commit -q -m "feat: FlickSmith v0.4 professional motion engine"
          FEATURE_SHA="$(git rev-parse HEAD)"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push --force origin "$FEATURE_SHA:refs/heads/feature/flicksmith-v0.4-professional-motion-engine"
