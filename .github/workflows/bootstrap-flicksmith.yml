name: Bootstrap FlickSmith history

on:
  push:
    paths:
      - 'bootstrap/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified FlickSmith v0.2 and v0.3 trees
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/baseline-* | base64 --decode > /tmp/flicksmith-v02.tar.xz
          cat bootstrap/delta-* | base64 --decode > /tmp/flicksmith-v03.patch.xz
          test "$(sha256sum /tmp/flicksmith-v02.tar.xz | awk '{print $1}')" = "0937e55bfc3a3d017d96499a6de04fb4a6dec0b1e207de70ff9feb317a8fd9e5"
          test "$(sha256sum /tmp/flicksmith-v03.patch.xz | awk '{print $1}')" = "b60098d475bf28f0aa63515e395e9de7f3859185f4d609524a4c42e2638ed57d"

          git config user.name "Praket7"
          git config user.email "149203433+Praket7@users.noreply.github.com"

          git checkout --orphan flicksmith-v02-import
          git rm -rf .
          tar -xJf /tmp/flicksmith-v02.tar.xz -C .
          git add -A
          test "$(git write-tree)" = "7ab880b6962447a6ffeeba45f4e6c422de8fcea1"
          git commit -m "chore: import verified FlickSmith v0.2 baseline"
          BASE_SHA="$(git rev-parse HEAD)"

          git checkout -b feature/flicksmith-v0.3-motion-architecture
          xz -dc /tmp/flicksmith-v03.patch.xz | git apply --index --binary
          test "$(git write-tree)" = "4f5beb4ead171167282c22d07c25384b4090c600"
          git commit -m "feat: implement FlickSmith v0.3 professional motion architecture"
          FEATURE_SHA="$(git rev-parse HEAD)"

          git push --force origin "$BASE_SHA:refs/heads/main"
          git push --force origin "$FEATURE_SHA:refs/heads/feature/flicksmith-v0.3-motion-architecture"
