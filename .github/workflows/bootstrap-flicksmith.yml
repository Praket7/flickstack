name: Bootstrap FlickSmith history

on:
  push:
    branches: [bootstrap-flicksmith-restore]
    paths:
      - 'bootstrap/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and checksum bundle
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/payload-* | base64 --decode > /tmp/flicksmith.bundle
          echo "bundle sha256=$(sha256sum /tmp/flicksmith.bundle | awk '{print $1}')"
          test "$(sha256sum /tmp/flicksmith.bundle | awk '{print $1}')" = "172e42853c25c81e5992d8a8bfe3d4494824c33f7cd89fea7e371918915e4de9"

      - name: Inspect bundle heads
        shell: bash
        run: |
          set -euo pipefail
          git bundle list-heads /tmp/flicksmith.bundle

      - name: Fetch verified bundle refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch /tmp/flicksmith.bundle \
            refs/heads/publish-main:refs/remotes/bundle/publish-main \
            refs/heads/feature/flicksmith-v0.3-motion-architecture:refs/remotes/bundle/feature/flicksmith-v0.3-motion-architecture

      - name: Assert exact refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse refs/remotes/bundle/publish-main)" = "b450f3ccc2614b0863d3197aad3dcf9275d048e2"
          test "$(git rev-parse refs/remotes/bundle/feature/flicksmith-v0.3-motion-architecture)" = "2049df5a093e2e5aaa857340a2e3f7c1353d2879"

      - name: Publish exact v0.2 and v0.3 refs
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin refs/remotes/bundle/publish-main:refs/heads/main
          git push --force origin refs/remotes/bundle/feature/flicksmith-v0.3-motion-architecture:refs/heads/feature/flicksmith-v0.3-motion-architecture
