name: Rust Format Repair
on:
  push:
    branches: [feature/flicksmith-v0.5f-final]
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'style: normalize and rustfmt native workspace') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Normalize legacy leading-dot Rust floats
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for path in Path('crates').rglob('*.rs'):
              text = path.read_text()
              fixed = re.sub(r'(?<![\w.])\.(\d)', r'0.\1', text)
              if fixed != text:
                  path.write_text(fixed)
          PY
      - name: Format native workspace
        run: cargo fmt --all
      - name: Commit formatting repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates
          git commit -m "style: normalize and rustfmt native workspace"
          git push origin HEAD:feature/flicksmith-v0.5f-final
