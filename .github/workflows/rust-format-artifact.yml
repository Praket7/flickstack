name: Rust Format Artifact
on:
  push:
    branches: [feature/flicksmith-v0.5f-final]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Normalize legacy leading-dot Rust floats
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for path in Path('crates').rglob('*.rs'):
              text = path.read_text()
              fixed = re.sub(r'(?<![\w.])\.(\d)', r'0.\1', text)
              if fixed != text:
                  path.write_text(fixed)
          PY
      - name: Produce rustfmt patch
        run: |
          cargo fmt --all
          git diff --binary > rustfmt.patch
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch
