name: Temporary rustfmt fixer
on:
  push:
    branches: ['feature/flicksmith-v0.5-final']
permissions:
  contents: write
jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/flicksmith-v0.5-final
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit canonical rustfmt if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'style(rust): apply canonical rustfmt'
          git push origin HEAD:feature/flicksmith-v0.5-final
