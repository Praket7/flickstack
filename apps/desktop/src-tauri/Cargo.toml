[package]
name = "flicksmith-desktop"
version = "0.4.0"
edition = "2021"
[build-dependencies]
tauri-build = { version = "=2.6.1" }
[dependencies]
tauri = { version = "=2.11.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem","Win32_Foundation"] }
