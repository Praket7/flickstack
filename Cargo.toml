[workspace]
resolver = "2"
members = ["crates/flick-preview", "crates/flick-render-contract", "crates/flick-motion-runtime", "crates/flick-text", "crates/flick-render-core", "crates/flick-render-cpu", "crates/flick-render-wgpu", "crates/flick-render-cli", "crates/flick-tracking-opencv"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
