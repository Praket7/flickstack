[package]
name = "flick-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["system-fonts", "complex-scripts"]
system-fonts = ["parley/system"]
complex-scripts = ["parley/complex-scripts"]

[dependencies]
serde.workspace = true
thiserror.workspace = true
parley = { version = "0.11.1", default-features = false, features = ["std"] }
# Keep Parley's compatible transitive requirement on the last ordered-float
# release whose MSRV remains below FlickSmith's Rust 1.88 floor.
ordered-float = "=5.3.0"
fontique = "0.11.1"
skrifa = "0.44.0"

[dev-dependencies]
serde_json.workspace = true
